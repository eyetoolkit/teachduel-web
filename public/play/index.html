<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question · TeachDuel</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(180deg,#0a171b,#0e1d22); color:#e9f3f7; min-height:100vh; padding:24px 20px; margin:0; }
  .wrap { max-width:640px; margin:0 auto; }
  .meta { color:#9fbcc8; font-size:.9rem; margin-bottom:18px; }
  .progress-bar { height:6px; background:#1d3a44; border-radius:3px; overflow:hidden; margin-bottom:18px; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#0fb5a8,#38d9c9); transition:width .3s ease; }
  .q-prompt { font-size:1.35rem; line-height:1.5; margin:24px 0 28px; color:#fff; }
  .choices { display:flex; flex-direction:column; gap:10px; }
  .choice { background:#1a3d4a; border:2px solid #26546a; border-radius:12px; padding:16px 18px; cursor:pointer; font-size:1.05rem; color:#e9f3f7; transition:all .15s ease; text-align:left; }
  .choice:hover:not(:disabled) { background:#26546a; border-color:#38d9c9; transform:translateY(-1px); }
  .choice:disabled { cursor:not-allowed; }
  .choice.correct { background:rgba(74,222,128,.18); border-color:#4ade80; color:#4ade80; }
  .choice.wrong { background:rgba(255,107,107,.18); border-color:#ff6b6b; color:#ff6b6b; }
  .choice.picked { box-shadow:0 0 0 2px #38d9c9; }
  .feedback { margin-top:18px; padding:14px 18px; border-radius:10px; font-size:.95rem; line-height:1.5; }
  .feedback.ok { background:rgba(74,222,128,.12); color:#aaffba; border-left:4px solid #4ade80; }
  .feedback.bad { background:rgba(255,107,107,.12); color:#ffb0b0; border-left:4px solid #ff6b6b; }
  .controls { margin-top:24px; display:flex; gap:10px; justify-content:space-between; }
  button.next { background:#0fb5a8; color:#06221f; border:0; padding:12px 24px; border-radius:10px; font-weight:600; cursor:pointer; font-size:1rem; }
  button.next:disabled { background:#26546a; cursor:not-allowed; color:#9fbcc8; }
  .finished { text-align:center; padding:40px 20px; }
  .finished .score { font-size:3rem; font-weight:700; color:#0fb5a8; margin:20px 0; }
  .err { color:#ffb0b0; padding:20px; background:rgba(255,107,107,.12); border-radius:10px; }
  .timer { font-size:.85rem; color:#9fbcc8; float:right; }
  a.brand { color:#38d9c9; text-decoration:none; font-size:.85rem; }
  .sid-gate { padding:24px 0; }
  .sid-input { width:100%; box-sizing:border-box; background:#1a3d4a; border:2px solid #26546a; border-radius:12px; padding:16px 18px; font-size:1.05rem; color:#e9f3f7; font-family:inherit; }
  .sid-input:focus { outline:none; border-color:#38d9c9; }
  .sid-input::placeholder { color:#7ba3b0; }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="https://teachduel.com">← TeachDuel</a>
  <div id="app"><p style="color:#9fbcc8">Loading…</p></div>
</div>
<script src="play.js"></script>
</body>
</html>

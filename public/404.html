<!DOCTYPE html>
<html lang="en" data-site="teach">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 - Page Not Found · TeachDuel</title>
  <meta name="description" content="404 - Page not found · TeachDuel">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <style>
    :root { --p: #0f766e; --p-h: #115e59; --bg: #f0fdfa; --t: #134e4a; --m: #6b7280; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--t); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .nf-code { font-size: clamp(4rem, 12vw, 7rem); font-weight: 800; line-height: 1; color: var(--p); }
    .nf-title { font-size: 1.25rem; font-weight: 600; margin: 12px 0 8px; }
    .nf-desc { font-size: 0.95rem; color: var(--m); margin-bottom: 24px; }
    .nf-btn {
      display: inline-block; background: var(--p); color: #fff; text-decoration: none;
      padding: 12px 28px; border-radius: 8px; font-size: 0.95rem; font-weight: 500;
    }
    .nf-btn:hover { background: var(--p-h); }
    .nf-family { margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(15,118,110,.2); font-size: 0.85rem; }
    .nf-family span { color: var(--m); margin-right: 10px; }
    .nf-family a { color: var(--p); text-decoration: none; margin: 0 8px; }
    .nf-family a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="nf-code">404</div>
  <h1 class="nf-title">Page not found</h1>
  <p class="nf-desc">这个页面不存在或已被移动。</p>
  <a class="nf-btn" href="/">回到 TeachDuel 首页</a>
  <div class="nf-family">
    <span>Duel Family</span>
    <a href="https://boardduel.com">BoardDuel</a>
    <a href="https://numeriduel.com">NumeriDuel</a>
    <a href="https://memoryduel.com">MemoryDuel</a>
    <a href="https://teachduel.com">TeachDuel</a>
  </div>
</body>
</html>

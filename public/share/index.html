<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared bank · TeachDuel</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(180deg, #0a171b, #0e1d22); color: #e9f3f7; padding: 40px 20px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  a.back { color: #38d9c9; text-decoration: none; font-size: .92rem; }

  .meta { color: #9fbcc8; font-size: .92rem; margin-bottom: 14px; }
  .desc { color: #c0d4d8; line-height: 1.55; margin-bottom: 18px; }
  button { background: #0fb5a8; color: #06221f; border: 0; padding: 12px 22px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 1rem; }
  button:hover { background: #38d9c9; }
  button.secondary { background: transparent; color: #38d9c9; border: 1px solid #38d9c9; }
  .forkcount { color: #9fbcc8; font-size: .88rem; margin-top: 14px; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: .76rem; font-weight: 700; background: rgba(74, 222, 128, .18); color: #4ade80; margin-right: 6px; }
  .err { color: #ffb0b0; padding: 20px; background: rgba(255, 107, 107, .12); border-radius: 10px; }
  .cta-row { display: flex; gap: 10px; margin-top: 14px; }
</style>
